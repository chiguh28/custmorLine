{% extends "base.html" %}

{% block title %}予約{% endblock %}

{% block content %}
<h2 class="mb-4 text-center">予約フォーム</h2>
<p class="text-center mb-4"><i class="bi bi-geo-alt-fill text-danger"></i> 場所: {{ salon_location }}</p>

<div id="step1">
    <h4>1. コース選択</h4>
    <div id="course-list" class="row g-3">
        <!-- Courses will be loaded here -->
    </div>
</div>

<div id="step2" class="mt-4" style="display:none;">
    <h4>2. 日時選択</h4>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <button class="btn btn-outline-secondary btn-sm" id="prev-week">&lt; 前の週</button>
        <h5 id="current-week-label" class="m-0"></h5>
        <button class="btn btn-outline-secondary btn-sm" id="next-week">次の週 &gt;</button>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered text-center" id="calendar-table">
            <thead>
                <tr id="calendar-header">
                    <th>時間</th>
                    <!-- Dates will be inserted here -->
                </tr>
            </thead>
            <tbody id="calendar-body">
                <!-- Time slots will be inserted here -->
            </tbody>
        </table>
    </div>
</div>

<div id="step3" class="mt-4" style="display:none;">
    <h4>3. お客様情報</h4>
    <form id="booking-form">
        <div class="mb-3">
            <label for="name" class="form-label">お名前</label>
            <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">電話番号</label>
            <input type="tel" class="form-control" id="phone" placeholder="090-1234-5678" required>
        </div>
        <div class="alert alert-info" id="summary">
            <!-- Summary will be shown here -->
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">予約する</button>
    </form>
</div>

<!-- Hidden inputs -->
<input type="hidden" id="user-id" value="{{ user_id }}">
<input type="hidden" id="liff-id" value="{{ liff_id }}">
<input type="hidden" id="selected-course-id">
<input type="hidden" id="selected-time">

<!-- Result Overlay -->
<div id="result-overlay" class="result-overlay" style="display: none;">
    <div class="result-content">
        <h3 id="result-title"></h3>
        <p id="result-message"></p>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/booking.js') }}"></script>
{% endblock %}
